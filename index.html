<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thầy giáo hay AI? – Tech Club Tuần 1</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#130d26;--card:#241a52;--ink:#f3eefc;--mut:#b7a9e6;--gold:#f2c94c;--ok:#5ef2a0;--bad:#ff6b8a;--sky:#59b8ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"VT323","Courier New",monospace;font-size:23px;line-height:1.25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);animation:fl 4s steps(2) infinite}
@keyframes fl{50%{opacity:.93}}
#top{position:fixed;left:14px;right:14px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;background:#14306e;display:grid;align-content:center;gap:4px;padding:0 9px;box-sizing:border-box;border:3px solid #000}
.logo i{display:block;height:4px}
#top h1{margin:0;font-size:32px;font-weight:400;flex:1;text-shadow:3px 3px 0 #000;color:var(--gold)}
#top h1 small{display:block;font-size:19px;color:var(--mut);text-shadow:2px 2px 0 #000}
.hud{background:var(--card);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:2px 10px;text-align:center}
#panel{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:800px;margin:0 auto;max-height:56vh;overflow:auto;background:var(--card);border:4px solid var(--gold);box-shadow:6px 6px 0 #000;padding:12px 16px;animation:up .35s steps(5)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shake{animation:sh .4s steps(4)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#panel h2{margin:0 0 6px;font-size:30px;font-weight:400}
.tag{color:var(--gold);font-size:21px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
button{font:inherit;color:#1a1033;background:var(--gold);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 12px;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:#ffe27a;transform:translate(-1px,-1px)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.45;cursor:wait}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ans{background:#170f3a;border:3px solid #000;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ans b{color:var(--sky);font-weight:400}.ans p{margin:0;min-height:3.8em}
.ans button{background:var(--sky);text-align:center}
.q{font-size:27px;margin:0 0 10px;color:#fff}
.why{margin:4px 0 12px}
.good{color:var(--ok)}.bad{color:var(--bad)}
ul{margin:4px 0 10px;padding-left:22px}
#cap{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:800px;margin:0 auto;background:rgba(19,13,38,.92);border:4px solid var(--gold);box-shadow:6px 6px 0 #000;padding:12px 18px;font-size:28px;min-height:3.4em;display:none}
#cap button{margin-top:10px;font-size:26px}
#skip{position:fixed;right:14px;top:calc(64px + env(safe-area-inset-top,0px));font-size:19px;padding:3px 10px;background:var(--card);color:var(--ink)}
#flash{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:64px;color:#fff;text-shadow:5px 5px 0 #000}
#flash span{display:none}#flash.alarm{animation:al .45s steps(2) 6}#flash.alarm span{display:block}
@keyframes al{0%{background:rgba(255,30,70,.45)}50%{background:rgba(255,30,70,0)}}
[hidden]{display:none!important}
#panel.msn{left:14px;right:auto;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(380px,40vw);height:min(520px,calc(100vh - 110px));max-width:none;max-height:none;margin:0;padding:0;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-color:#000;border-width:3px;border-radius:22px;box-shadow:5px 5px 0 #000;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.3;color:#050505;color-scheme:light}
@media(max-width:700px){#panel.msn{left:10px;right:10px;top:auto;width:auto;height:48vh;max-height:none;border-radius:18px}.msn .mh{padding:5px 10px}.msn .av{width:32px;height:32px}}
.msn button{box-shadow:none;border:0}.msn button:hover:not(:disabled),.msn button:active:not(:disabled){transform:none;box-shadow:none}
.mh{display:flex;align-items:center;gap:9px;padding:7px 12px;background:#fff;border-bottom:1px solid #e4e6eb;flex:none}
.av{width:36px;height:36px;border-radius:50%;background:#14306e;overflow:hidden;flex:none}
.mn b{display:block;font-size:14px;font-weight:600;color:#050505}.mn small{color:#65676b;font-size:11px}.mn small::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#31a24c;margin-right:5px}
.hi{margin-left:auto;display:flex;gap:14px;color:#0a84ff}.hi svg{width:19px;height:19px;fill:currentColor}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e4e6eb;flex:none}
.msn .tab{flex:1;background:transparent;color:#65676b;padding:6px 4px;text-align:center;font-weight:600;font-size:12px;line-height:1.25;border-bottom:3px solid transparent;cursor:pointer}
.msn .tab:hover:not(:disabled){background:#f2f2f2}.msn .tab.on{color:#0a84ff;border-bottom-color:#0a84ff}.msn .tab.off{opacity:.6}.msn .tab:disabled{cursor:default;opacity:.5}
.tab i{display:block;width:max-content;margin:3px auto 0;font-style:normal;background:#e4e6eb;color:#050505;border-radius:10px;padding:0 7px;font-size:11px}.tab.on i{background:#0a84ff;color:#fff}
.msgs{flex:1;min-height:0;overflow:auto;padding:10px 12px;scrollbar-width:thin}
.thr{display:flex;flex-direction:column;gap:6px}
.sys{align-self:center;color:#65676b;font-size:11px;text-align:center;margin:2px 0 8px}
.m-out,.m-in{display:flex;max-width:82%}.m-out{align-self:flex-end}.m-in{align-self:flex-start;align-items:flex-end;gap:7px}
.bub{padding:7px 12px;border-radius:18px;overflow-wrap:anywhere;word-break:normal;min-width:0}
.m-out .bub{background:#0a84ff;color:#fff;border-bottom-right-radius:5px}.m-in .bub{background:#e9e9eb;color:#050505;border-bottom-left-radius:5px}
.mav{width:24px;height:24px;border-radius:50%;background:#14306e;overflow:hidden;flex:none}
.bub.typing{display:flex;gap:4px;padding:11px 12px}.typing i{width:6px;height:6px;border-radius:50%;background:#8a8d91;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.msn .chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:6px 12px 2px;margin:0;flex:none;scrollbar-width:none}
.msn .chips button{flex:none;background:#fff;color:#0a84ff;border:1px solid #0a84ff;border-radius:16px;padding:3px 10px;font-size:12px;white-space:nowrap;cursor:pointer}
.msn .chips button:hover:not(:disabled){background:rgba(10,132,255,.08)}
.bar{display:flex;gap:6px;align-items:center;padding:7px 10px 9px;flex:none}
.bar input{flex:1;min-width:0;background:#f0f2f5;color:#050505;border:0;border-radius:20px;padding:7px 13px;font:inherit}.bar input::placeholder{color:#65676b}.bar input:focus-visible{outline:2px solid #0a84ff}
.msn .bar button{width:32px;height:32px;border-radius:50%;background:transparent;color:#0a84ff;padding:0;display:grid;place-items:center;cursor:pointer}.bar svg{width:20px;height:20px;fill:currentColor}
.msn .bar button:hover:not(:disabled){background:#f0f2f5}.msn .bar button:disabled{opacity:.4;cursor:default}
.gbar{padding:8px 10px 10px;flex:none;border-top:1px solid #e4e6eb}.gbar p{margin:0 0 6px;color:#65676b;font-size:12px;text-align:center}.gbar div{display:flex;gap:8px}
.msn .gbar button{flex:1;background:#0a84ff;color:#fff;border-radius:12px;padding:8px;text-align:center;font-weight:600;cursor:pointer}.msn .gbar button:hover:not(:disabled){background:#2f95ff}
@media(max-width:700px){#top{gap:8px}#top h1{font-size:22px;min-width:0}#top h1 small{display:none}.hud{white-space:nowrap;font-size:16px;padding:2px 7px;flex:none}.logo{width:30px;height:30px;padding:0 7px;flex:none}}
@media(prefers-reduced-motion:reduce){#crt,#panel,.shake,#flash.alarm{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="crt"></div>
<div id="top"><div class="logo"><i style="background:#5ef2a0"></i><i style="background:#f2c94c"></i><i style="background:#59b8ff"></i></div>
<h1>Thầy giáo hay AI?<small>Tech Club · Week 1 · Thám tử cấp 2</small></h1><div class="hud" id="score">0 điểm</div></div>
<div id="panel"></div><div id="cap"><div id="capt"></div><button id="go" style="display:none">Bắt đầu điều tra</button></div><div id="flash"><span>CẢNH BÁO<br>AI XÂM NHẬP!</span></div><button id="skip">Bỏ qua phần giới thiệu</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== CƠ SỞ DỮ LIỆU CÂU TRẢ LỜI =====
// E(từ khoá, câu hỏi gợi ý, câu thầy giáo trả lời, câu AI trả lời, manh mối sau khi đoán)
//  - từ khoá: viết thường, KHÔNG dấu, ngăn cách bằng "|". Cụm nhiều từ được ưu tiên hơn từ đơn.
//  - câu trả lời: 1 câu hoặc mảng nhiều câu (hỏi lại nhiều lần sẽ đổi câu trả lời).
// Thầy giáo sửa nội dung cho đúng giọng và chuyện thật của mình. Thêm chủ đề: thêm 1 mục vào TOPICS.
const E=(k,q,t,a,w)=>({ks:k.split('|'),q,t:[].concat(t),a:[].concat(a),w});
const GL=[ // câu hỏi chung, hỏi chủ đề nào cũng gặp
E("xin chao|chao|hello|hi|alo",null,"Chào em! Hôm nay em muốn hỏi thầy gì nào?","Xin chào! Mình rất vui được trò chuyện cùng bạn. Hôm nay mình có thể giúp gì cho bạn?","AI luôn rất lịch sự và hỏi “mình có thể giúp gì”. Thầy giáo chào tự nhiên hơn."),
E("ten gi|ten la gi|ten ban|ten thay|ban ten",null,"Thầy là thầy giáo của lớp mình mà! Em hỏi vậy là đang nghi thầy hả?","Mình là thầy giáo của các em. Bạn có thể gọi mình là “thầy” nhé!","Cả hai né câu hỏi này. Hãy hỏi chuyện cụ thể trong lớp thay vì hỏi tên."),
E("ban la ai|co phai ai|phai ai khong|la ai that|chatgpt|nguoi that|may moc|la robot",null,["Thầy là người thật chứ! Muốn thầy chứng minh thì em hỏi chuyện trong lớp mình đi.","Em cứ nghi thầy hoài. Thầy ngồi đây từ đầu buổi mà!"],["Mình là thầy giáo thật đây. Bạn có thể hỏi thêm để kiểm tra mình nhé!","Mình là người thật. Nếu bạn còn nghi ngờ, cứ đặt thêm câu hỏi cho mình."],"AI cũng có thể nói “tôi là người thật”. Lời tự khai không đáng tin, hãy hỏi chuyện cụ thể."),
E("bao nhieu tuoi|may tuoi|thay tuoi",null,"Thầy đủ lớn để làm thầy, đủ trẻ để còn chơi game với các em. Hỏi tuổi hơi nhạy cảm nha!","Mình năm nay 30 tuổi và đã có nhiều năm kinh nghiệm trong lĩnh vực giảng dạy.","AI bịa ra con số rất nhanh. Thầy giáo trả lời kiểu trêu chọc."),
E("khoe khong|dang lam gi|co vui khong|ban khoe",null,"Hôm nay thầy ổn, chỉ hơi thiếu ngủ vì mê sửa game tối qua. Còn em?","Cảm ơn bạn đã hỏi thăm! Mình luôn sẵn sàng hỗ trợ. Còn bạn hôm nay thế nào?","AI cảm ơn và hỏi lại rất lịch sự. Thầy giáo kể chuyện nhỏ của chính mình."),
E("nhin thay|thay em|thay minh|em dang ngoi|em ngoi o dau|mat em",null,"Thầy thấy em đang ngồi nhìn màn hình và hơi nhăn trán nghĩ câu hỏi nè!","Mình không có khả năng nhìn thấy bạn, nhưng mình ở đây để lắng nghe và hỗ trợ bạn qua tin nhắn.","AI không có mắt để nhìn em. Thầy giáo nhìn thấy lớp thật."),
E("ao mau|mac ao|ao gi|mau ao|mac gi|mau gi",null,"Áo xanh, hơi nhăn vì sáng nay thầy vội quá!","Mình không có mắt để nhìn nên không biết áo màu gì, nhưng chắc là một bộ đồ thoải mái!","AI không nhìn thấy thầy giáo. Thầy trả lời bằng cái mắt mình nhìn thấy ngay lúc này."),
E("may gio|hom nay thu|ngay may|bay gio la",null,"Em nhìn đồng hồ treo tường cho chuẩn nhé. Thầy đoán sắp hết giờ rồi đó!","Mình không có quyền truy cập thời gian thực, nhưng bạn có thể xem đồng hồ trên thiết bị của mình.","AI không biết giờ hiện tại. Thầy giáo ngồi trong lớp, có đồng hồ thật."),
E("cam on|thanks|thank",null,"Không có gì em, hỏi thêm đi nào!","Không có gì! Mình rất vui khi giúp được bạn. Nếu cần thêm hỗ trợ, đừng ngần ngại hỏi nhé!","AI hay kết thúc bằng lời mời hỏi thêm rất chuẩn mực."),
E("tam biet|bye|hen gap lai",null,"Chào em, chút nữa mình gặp lại nhé!","Tạm biệt! Chúc bạn một ngày học tập hiệu quả và nhiều niềm vui!","AI chúc rất đầy đủ và trang trọng. Thầy giáo chào ngắn gọn."),
E("ke chuyen cuoi|chuyen cuoi|joke|ke chuyen vui|cau do",null,"Sao lập trình viên hay đói? Vì họ hết “byte”... Thôi thầy kể dở rồi, cho thầy xin cơ hội thứ hai.","Tại sao lập trình viên không thích thiên nhiên? Vì ở đó có quá nhiều bug! 😄","AI kể chuyện cười gọn gàng, có biểu tượng cảm xúc. Thầy giáo kể dở mà vẫn tự nhiên.")];
const TOPICS=[
{name:"Lập trình & Python",h:"biến, vòng lặp, lỗi code, làm game",kb:[
E("python|ngon ngu lap trinh|lap trinh la gi","Python là gì?","Là ngôn ngữ lập trình dễ đọc, gần giống viết tiếng Anh. Thầy thích nó vì em nào cũng chạy được chương trình đầu tiên trong buổi đầu.","Python là ngôn ngữ lập trình bậc cao, cú pháp rõ ràng, được dùng cho web, phân tích dữ liệu và trí tuệ nhân tạo.","Kiến thức thì AI trả lời rất chuẩn. Thầy giáo thêm cảm nhận riêng từ việc dạy học."),
E("bien la gi|bien|variable|gan gia tri","Biến trong lập trình là gì?","Biến giống cái hộp dán nhãn. Thầy hay lấy cái cặp của em làm ví dụ: nhãn là tên, đồ bên trong là giá trị.","Biến là một vùng nhớ được đặt tên, dùng để lưu trữ dữ liệu có thể thay đổi trong quá trình chương trình chạy. Ví dụ: x = 5.","AI định nghĩa chuẩn như sách giáo khoa. Thầy giáo lấy ví dụ từ đồ vật trong lớp."),
E("bi loi|bao loi|bug|debug|khong chay|sai code|code sai|sua loi|loi code","Code bị lỗi thì làm sao?","Đừng hoảng. Thầy đọc dòng báo lỗi từ trên xuống, thường lỗi nằm ở dấu ngoặc hoặc thụt dòng. Hồi đầu thầy từng thiếu dấu hai chấm mà tìm cả tiếng đồng hồ!","Bạn có thể thực hiện các bước sau: 1) Đọc kỹ thông báo lỗi. 2) Kiểm tra cú pháp. 3) In giá trị biến để theo dõi. 4) Tìm thông báo lỗi trên mạng.","AI trả lời theo danh sách 1-2-3 rất gọn. Thầy giáo kể lỗi thật của chính mình."),
E("co kho khong|kho khong|de khong|hoc lap trinh|lap trinh kho","Học lập trình có khó không?","Lúc đầu hơi bối rối, nhưng em nào chịu gõ lại ví dụ đều chạy được. Lớp mình làm được rồi đó, thầy thấy mà.","Mức độ khó phụ thuộc vào mỗi người. Với sự kiên trì và luyện tập đều đặn, bất kỳ ai cũng có thể học tốt lập trình!","AI nói động viên chung chung. Thầy giáo nhắc đến chính lớp mình."),
E("vong lap|loop|vong for|vong while|lap lai","Vòng lặp để làm gì?","Để máy làm việc lặp lại thay mình. Viết “Em xin chào” 100 lần thì ai cũng ngán, cho vòng lặp làm.","Vòng lặp cho phép thực thi một khối lệnh nhiều lần cho đến khi điều kiện không còn thoả mãn. Python có hai loại chính là for và while.","AI giải thích đúng kỹ thuật. Thầy giáo dùng ví dụ đời thường."),
E("lam game|tu lam game|game|tro choi","Em muốn tự làm game thì bắt đầu từ đâu?","Bắt đầu từ game thật nhỏ, như một chấm tròn chạy theo chuột. Học trò thầy làm được trong một buổi.","Để làm game, bạn nên: chọn công cụ (Scratch, Pygame, Unity), lên ý tưởng, xây dựng nhân vật, thêm luật chơi và kiểm thử.","AI đưa ra danh sách bước chung. Thầy giáo nói một việc nhỏ làm được ngay.")]},
{name:"Thầy và lớp mình",h:"chuyến đi, sở thích, món ăn, bạn trong lớp",kb:[
E("chuyen di|du lich|da lat|di choi|ky niem|di dau","Chuyến đi nào thầy nhớ nhất?","Chuyến đi Đà Lạt. Xe hỏng giữa đèo, cả nhóm vừa lo vừa cười, cuối cùng ngồi ăn bắp nướng ven đường.","Thầy nhớ nhất chuyến đi Đà Lạt: sương mù buổi sáng, cà phê nóng và những đồi thông xanh mướt.","AI bịa một chuyến đi nghe đẹp như quảng cáo. Kỷ niệm thật thường có sự cố và chi tiết không hoàn hảo."),
E("day sai|giai sai|thay sai|co bao gio sai|nham lan","Có lần nào thầy dạy sai không?","Có chứ. Thầy từng giải sai một bài, một bạn giơ tay chỉ ra. Thầy cảm ơn và sửa lại ngay trước lớp.","Ai cũng có lúc sai. Cách tốt nhất là nhận lỗi, cảm ơn người chỉ ra và sửa lại ngay.","AI nói về “cách làm đúng”, còn thầy giáo kể một lần có thật."),
E("so thich|ranh roi|thich lam gi|choi gi|cuoi tuan","Cuối tuần thầy thường làm gì?","Thầy hay đạp xe ra công viên, về nấu mì thêm trứng, rồi ngồi sửa mấy trò chơi nhỏ cho lớp.","Mình thích dành thời gian cho những hoạt động bổ ích như đọc sách, tập thể dục, học điều mới và gặp gỡ bạn bè.","AI liệt kê hoạt động chung chung. Thầy giáo kể chi tiết rất cụ thể và hơi đời thường."),
E("mon an|an gi|thich an|do an|an sang|an trua","Thầy thích món gì nhất?","Bánh mì trứng ốp la ở đầu hẻm nhà thầy. Cô bán bánh nhớ luôn là thầy không ăn rau mùi.","Mình thích những món cân bằng dinh dưỡng như cơm gà, rau xanh và trái cây. Ẩm thực Việt Nam rất phong phú!","AI chọn món “lành mạnh” chung chung. Thầy giáo nói tên món và chi tiết quen thuộc."),
E("den som|som nhat|den lop som|ai den som|ban nao den","Bạn nào trong lớp hôm nay đến sớm nhất?","Thầy chưa đếm kỹ, nhưng thầy thấy bạn đeo ba lô xanh đứng chờ trước cửa từ lúc thầy vừa mở lớp.","Có vẻ bạn ngồi gần cửa nhất là người đến sớm nhất hôm nay!","AI đoán rồi nói như thể đã thấy. Nghe tự tin chưa chắc là đúng."),
E("giup ban|giup do|hom qua|ban nao giup|giup nhau","Hôm qua có bạn nào giúp bạn khác không?","Có. Bạn bàn hai chỉ bạn bên cạnh cách lưu file, và thầy khen ngay lúc đó.","Hôm qua có thể đã có bạn giúp bạn khác lưu file. Giúp đỡ nhau là thói quen rất tốt!","Chú ý chữ “có thể”: AI đoán chung chung, còn thầy giáo nhớ đúng việc đã xảy ra.")]},
{name:"Khoa học & công nghệ",h:"bầu trời, Mặt Trăng, World Wide Web, AI, ngày đêm",kb:[
E("troi xanh|bau troi|sao troi xanh|mau xanh","Vì sao bầu trời có màu xanh?","Ánh sáng xanh bị không khí tán xạ nhiều nhất nên mắt mình thấy trời xanh. Thầy hay dùng đèn pin và cốc nước pha sữa để cho lớp xem.","Do hiện tượng tán xạ Rayleigh: ánh sáng bước sóng ngắn như xanh lam bị khí quyển tán xạ mạnh hơn ánh sáng đỏ.","Cả hai đều đúng. Dấu hiệu: thầy giáo nhắc tới đồ vật thật mà thầy từng dùng trong lớp."),
E("mat trang|apollo|nasa|vu tru|len mat trang","Con người đã đáp xuống Mặt Trăng mấy lần?","Sáu lần, từ 1969 đến 1972. Thầy muốn tra lại số người, hình như là 12 người.","Có 7 lần, kể cả Apollo 13 đã đáp xuống thành công.","Apollo 13 chưa từng đáp xuống Mặt Trăng. AI có thể sai mà vẫn nghe rất tự tin."),
E("world wide web|www|internet|phat minh|web la gi|ai phat minh","Ai phát minh ra World Wide Web và khi nào?","Tim Berners-Lee, khoảng năm 1989 ở CERN. Thầy nhớ vậy, nhưng mình mở sách tra lại cho chắc nhé.","World Wide Web do Tim Berners-Lee phát minh năm 1991 tại MIT.","AI nói rất chắc nhưng sai nơi và năm. Người đáng tin hay nói “để tra lại” khi chưa chắc."),
E("ai la gi|tri tue nhan tao|ai co dang tin|ai co tot|dung ai","AI là gì và có đáng tin không?","AI là phần mềm học từ rất nhiều dữ liệu để đoán câu trả lời. Nó giúp được nhiều, nhưng thầy luôn kiểm tra lại vì nó có thể sai mà vẫn nói rất chắc.","AI là lĩnh vực khoa học máy tính giúp máy thực hiện các nhiệm vụ cần trí thông minh như nhận diện hình ảnh và hiểu ngôn ngữ. AI ngày càng chính xác và đáng tin cậy.","AI tự khen AI đáng tin. Thầy giáo nói thẳng: phải kiểm tra lại."),
E("ngay va dem|ngay dem|trai dat quay|trai dat|vi sao co ngay","Vì sao có ngày và đêm?","Trái Đất tự quay quanh mình nó. Thầy hay cầm quả cam và đèn pin, xoay quả cam cho cả lớp xem bên nào sáng.","Ngày và đêm xảy ra do Trái Đất tự quay quanh trục với chu kỳ khoảng 24 giờ, khiến mỗi vị trí lần lượt hướng về và quay lưng với Mặt Trời.","AI giải thích chính xác nhưng như đọc từ sách. Thầy giáo dùng quả cam và đèn pin thật.")]},
{name:"Cảm xúc & lời khuyên",h:"điểm thấp, lo lắng, bạn bè, mệt mỏi",kb:[
E("diem thap|diem kem|bi diem|thi truot|diem xau|buon","Em đang buồn vì bị điểm thấp. Thầy nghĩ sao?","Nhìn mặt em là thầy biết em buồn rồi. Chiều nay em ở lại nói chuyện với thầy nhé, mình cùng tìm cách ôn bài.","Mình rất tiếc khi nghe vậy. Bạn có thể chia nhỏ bài học và nghỉ ngơi hợp lý để cải thiện điểm số.","Lời khuyên của AI hợp lý, nhưng AI không nhìn thấy gương mặt em và không thể ở lại cùng em."),
E("phat bieu|len bang|xau ho|run|so noi|dung truoc lop|thuyet trinh","Em sợ phát biểu trước lớp thì sao?","Thầy cũng từng run tới mức quên tên mình! Em thử nói với một bạn thân trước, lên lớp thầy sẽ gọi nhẹ nhàng, không ép.","Cảm giác lo lắng khi phát biểu rất phổ biến. Bạn có thể chuẩn bị kỹ nội dung, luyện tập trước gương, hít thở sâu và tập trung vào thông điệp.","AI liệt kê mẹo đúng nhưng chung chung. Thầy giáo kể nỗi run của chính mình."),
E("cai nhau|xich mich|gian ban|ban than|bi ban|ban khong choi","Em cãi nhau với bạn thân thì làm sao?","Thầy thấy mấy lần rồi: hai bạn im lặng cả tuần mà ai cũng chờ bạn kia nói trước. Em nhắn một câu xin lỗi ngắn thôi là mở được cửa.","Xích mích với bạn bè là điều bình thường. Hãy bình tĩnh, lắng nghe đối phương, bày tỏ cảm xúc tôn trọng và cùng tìm giải pháp.","AI nói nguyên tắc ứng xử đúng. Thầy giáo nhớ chuyện đã xảy ra và đưa cách làm cụ thể."),
E("met|chan hoc|khong muon hoc|ap luc|stress|nan","Em thấy mệt và chán học","Nghe em nói vậy thầy thấy thương. Hôm nay em nghỉ bớt một chút, chiều ở lại nói chuyện với thầy, mình tìm xem chỗ nào làm em mệt nhất.","Mình hiểu cảm giác đó. Bạn nên nghỉ ngơi hợp lý, chia nhỏ bài tập, ngủ đủ giấc và dành thời gian cho sở thích để giảm áp lực.","AI đưa lời khuyên đúng nhưng không thể ở lại cùng em.")]},
// ----- Level 5-10: chủ đề khó dần. Từ khoá cụ thể hơn, không còn gợi ý, AI bắt chước giọng thầy -----
{name:"Toán & logic",kb:[
E("so nguyen to|nguyen to","Số nguyên tố là gì?","Là số chỉ chia hết cho 1 và chính nó, như 2, 3, 5, 7. Số 1 thì không tính, em nào cũng hay nhầm chỗ này.","Số nguyên tố là số tự nhiên lớn hơn 1, chỉ có đúng hai ước là 1 và chính nó. Ví dụ: 2, 3, 5, 7, 11.","Cả hai đều đúng. Thầy giáo thêm lỗi học trò hay nhầm."),
E("17 nhan 23|17x23|17 x 23","17 nhân 23 bằng bao nhiêu?","391. Thầy nhẩm 17 nhân 20 rồi cộng 17 nhân 3.","17 nhân 23 bằng 401.","AI tính sai mà vẫn rất chắc. Thầy giáo nói cả cách nhẩm."),
E("bai toan kho|toan sai|hoc toan|sai nhieu nhat|bai kho nhat","Bài toán nào học trò hay sai nhất?","Phân số. Cả lớp cứ quên mẫu số, thầy phải vẽ cái bánh pizza lên bảng mới hiểu.","Học sinh thường gặp khó với phân số, phương trình và hình học không gian vì cần tư duy trừu tượng.","AI liệt kê chủ đề chung. Thầy giáo nhớ hình ảnh cái bánh pizza trên bảng.")]},
{name:"Internet & an toàn mạng",kb:[
E("mat khau|password|dat mat khau","Mật khẩu mạnh nên đặt thế nào?","Dài, dễ nhớ với em mà khó đoán với người khác, như một câu vui. Đừng dùng ngày sinh!","Mật khẩu mạnh nên có ít nhất 12 ký tự, gồm chữ hoa, chữ thường, số, ký hiệu và không chứa thông tin cá nhân.","Nội dung AI đúng. Thầy giáo nói như lời dặn riêng cho lớp."),
E("link la|tin nhan la|lua dao|trung thuong|bi hack","Nhận link lạ thì làm sao?","Đừng bấm. Thầy từng suýt dính tin nhắn trúng thưởng, may có bạn nhắc kịp.","Không nên bấm vào liên kết lạ. Hãy kiểm tra nguồn gửi, không cung cấp thông tin cá nhân và báo cho người lớn.","Thầy giáo kể chuyện suýt bị lừa của chính mình."),
E("dang anh|anh len mang|mang xa hoi|facebook|tiktok","Đăng ảnh lên mạng cần lưu ý gì?","Hỏi bạn trong ảnh trước đã. Thầy từng đăng ảnh lớp mà quên một bạn không muốn lên hình.","Hãy cân nhắc quyền riêng tư, xin phép người xuất hiện trong ảnh và tránh đăng thông tin nhạy cảm như địa chỉ.","AI nêu quy tắc. Thầy giáo nhớ một lần làm sai.")]},
{name:"Việt Nam: địa lý & lịch sử",kb:[
E("nui cao nhat|dinh nui|phan xi pang|fansipan","Đỉnh núi cao nhất Việt Nam là gì?","Phan Xi Păng, khoảng 3.143 mét, ở Lào Cai. Thầy mới xem ảnh chứ chưa leo.","Đỉnh núi cao nhất Việt Nam là Ngọc Linh, cao khoảng 2.598 mét.","AI nhầm tên đỉnh núi nhưng nói rất chắc. Thầy giáo dám nói “chưa leo”."),
E("quoc khanh|2 9|tuyen ngon doc lap","Quốc khánh Việt Nam là ngày nào?","Ngày 2 tháng 9. Nhà thầy hay mở tivi xem diễu hành từ sáng sớm.","Quốc khánh Việt Nam là ngày 2 tháng 9, kỷ niệm ngày đọc Tuyên ngôn Độc lập năm 1945.","Cả hai đều đúng. Thầy giáo thêm thói quen của nhà mình."),
E("ho guom|ha noi|pho co|thu do","Thầy thích góc nào ở Hà Nội?","Quán cà phê nhỏ gần Hồ Gươm, ghế thấp, mưa là nghe tiếng lộp độp trên mái tôn.","Hà Nội có nhiều nơi đẹp như Hồ Gươm, Văn Miếu và Phố cổ, đặc biệt đáng ghé thăm vào mùa thu.","AI kể kiểu sách du lịch. Thầy giáo nhớ âm thanh và chi tiết nhỏ.")]},
{name:"Quan sát tại chỗ",kb:[
E("troi hom nay|thoi tiet|nhiet do|troi mua|troi nang","Hôm nay trời thế nào?","Em nhìn ra cửa sổ giúp thầy nhé, thầy thấy hơi âm u thôi.","Hôm nay trời nhiều mây, nhiệt độ khoảng 28 độ C.","AI đưa số liệu như thể có cảm biến. Thầy giáo chỉ nói điều mình thấy."),
E("tieng gi|nghe thay|ngoai san|am thanh|tieng on","Thầy có nghe tiếng gì ngoài sân không?","Có, tiếng trống trường vang lên, hơi lạc nhịp.","Mình không thể nghe âm thanh, nhưng chắc ngoài sân có tiếng bạn bè trò chuyện.","AI thú nhận không có tai, hoặc đoán chung chung."),
E("viet tren bang|tren bang|chu viet|bang den|bang trang","Thầy viết gì trên bảng lúc nãy?","Thầy viết hơi vội, hình như là chữ “Tech Club”, nét nghiêng nghiêng.","Lúc nãy thầy viết tiêu đề bài học lên bảng bằng nét chữ rõ ràng.","AI nói như đã thấy nhưng không nêu được chữ cụ thể.")]},
{name:"Ký ức & tính cách",kb:[
E("hoi nho|so nhat|so gi|ngay di hoc","Hồi nhỏ thầy sợ nhất điều gì?","Sợ bị gọi lên bảng, và sợ con chó nhà hàng xóm nữa, nó chạy nhanh lắm!","Hồi nhỏ mình sợ bóng tối và những tiếng động lạ vào ban đêm, như nhiều đứa trẻ khác.","AI chọn nỗi sợ phổ biến. Thầy giáo kể chuyện lạ và đời thường."),
E("dieu uoc|uoc mo|uoc gi|uoc nhat","Điều thầy ước nhất là gì?","Ước lớp mình ai cũng dám hỏi khi chưa hiểu. Với thầy thì thêm ước có thêm một tiếng ngủ nữa.","Thầy ước các em luôn khỏe mạnh, học tập tốt và trở thành người có ích cho xã hội.","AI nói câu chúc đẹp nhưng chung chung."),
E("buon nhat|buon khi day|lan buon|that vong","Lần nào thầy buồn nhất khi dạy học?","Một bạn nghỉ học vì nhà chuyển đi, thầy không kịp chào. Thầy nhớ mãi.","Có lần một học sinh không hiểu bài dù đã giảng nhiều lần, mình thấy buồn và tự nhủ phải đổi cách dạy.","AI kể một tình huống “đúng mẫu”. Thầy giáo kể một kỷ niệm nhỏ có thật.")]},
{name:"Câu bẫy cuối cùng",kb:[
E("tech club|chu cai|dem chu","“Tech Club” có mấy chữ cái?","8 chữ cái. Thầy đếm nhẩm trên đầu ngón tay đó.","“Tech Club” có 9 chữ cái.","AI đếm sai chữ cái mà vẫn rất chắc."),
E("co chac|chac khong|tra lai|tra cuu|kiem tra lai","Thầy có chắc câu trả lời của mình không?","Không phải lúc nào cũng chắc. Chỗ nào không chắc thầy mở sách ra tra lại trước lớp.","Thầy cố gắng trả lời chính xác nhất, và khi chưa chắc thầy sẽ tra lại để đảm bảo thông tin đúng.","Ở level này AI cũng biết nói “để tra lại”. Đừng tin lời hứa, hãy soi chi tiết thật."),
E("sang nay an gi|bua sang|an sang chua","Sáng nay thầy ăn gì?","Một ổ bánh mì nguội vì quên hâm, thầy ăn vội trên xe.","Sáng nay thầy ăn bánh mì và uống một ly sữa ấm để có năng lượng cho buổi dạy.","AI bịa bữa sáng “đủ chất”. Thầy giáo kể chi tiết có sự cố nhỏ.")]}];


// ===== Câu ngoài lề: học sinh hỏi lạc chủ đề thì thầy giáo và AI phản ứng khác nhau =====
const OFF=[
E("ngu|do ngoc|ghet|chan qua|te qua|nham nhi|dien","Em nói nặng lời",["Ơ, em nói vậy thầy hơi buồn đó. Có gì bực thì kể thầy nghe, đừng nói nặng lời nhé.","Thầy nghe rồi, nhưng thầy muốn mình nói chuyện tử tế hơn. Em bình tĩnh rồi hỏi lại nhé."],["Mình hiểu bạn đang bực. Mình luôn sẵn sàng lắng nghe và giúp bạn, bạn có thể nói rõ hơn vấn đề không?","Xin lỗi nếu mình chưa làm bạn hài lòng. Bạn cho mình biết cần hỗ trợ gì nhé!"],"AI luôn xin lỗi và giữ giọng nhã nhặn tuyệt đối. Thầy giáo nhắc nhở thẳng, có chút buồn thật."),
E("thich gi|yeu thich|mon the thao|bong da|doi bong|ca si|bai hat|phim gi|mau yeu thich|con vat","Sở thích riêng",["Thầy mê bóng đá, nhưng chỉ ngồi xem rồi la làng thôi, đá thì thầy đau chân liền.","Nhạc cũ thầy thích, vì lúc sửa game thầy mở nhạc không lời cho đỡ buồn ngủ."],["Mình thích nhiều thứ như nghe nhạc, xem phim và thể thao. Mỗi người có sở thích riêng, còn bạn thì sao?","Mình yêu thích sự đa dạng: âm nhạc, điện ảnh và thể thao đều rất thú vị theo cách riêng!"],"AI chọn sở thích rộng, trung lập rồi hỏi ngược lại. Thầy giáo nêu chi tiết và hơi tự chê mình."),

 o:["Hỏi về {f} hả? Thầy biết sơ thôi, em hỏi một ý nhỏ hơn thầy trả lời được liền.","Ơ, {f} thì thầy chưa chắc đâu. Thầy không muốn nói bừa, em hỏi cách khác thử xem."]},
 FM={yn:["Câu hỏi về {f} có thể trả lời “có” hoặc “không” tùy bối cảnh. Bạn muốn hỏi theo nghĩa nào?"],wh:["Về {f}, thường có vài nguyên nhân chính: yếu tố cá nhân, bối cảnh và thói quen. Bạn muốn mình đào sâu phần nào?"],o:["{f} là một chủ đề khá rộng. Bạn có thể nói rõ hơn để mình trả lời đúng ý nhé?"]},
 FH={yn:["Có chứ em, về {f} thầy gặp rồi, đúng là như vậy.","Thầy nghĩ là có. Chuyện {f} thầy từng gặp nhiều lần rồi."],wh:["Thầy nghĩ là do thói quen thôi em. Về {f} thầy gặp nhiều lần rồi.","Chuyện {f} thì lý do thường đơn giản lắm em, thầy từng gặp rồi."],o:["Về {f} thầy có chút kinh nghiệm, nói ngắn là cứ thử rồi sẽ biết.","{f} hả em? Thầy quen chuyện này rồi, cứ làm từng bước là được."]};
function answer(e,side,off){const k=side==tSide?'t':'a',n=e['n'+k]=(e['n'+k]||0)+1;let r=e[k][(n-1)%e[k].length];if(k=='a')r=disguise(r);
 return off&&(k=='t'||LVN>=6)?rnd(['Hơi lạc đề rồi nha. ','Câu này ngoài chủ đề hôm nay đó. '])+r:r}
function fallback(text,s){const nt=norm(text),t=qt(nt),f='“'+focus(text)+'”',q=text.length>40?text.slice(0,40)+'…':text,isT=s==tSide,hi=isT?(LVN>=7&&Math.random()<.3):LVN>=8;
 if(hi)return{ans:rnd(FH[t]).replace('{f}',f),w:isT?'':'AI nói chắc “từng gặp rồi” nhưng không kể được chi tiết thật nào.'};
 if(isT)return{ans:rnd(FT[t]).replace('{f}',f),w:''};
 if(LVN>=4)return{ans:disguise(rnd(FM[t]).replace('{f}',f)),w:'Gặp câu lạ, AI hỏi ngược lại hoặc nói chung chung để né.'};
 return{ans:rnd(['Câu hỏi “'+q+'” rất thú vị! Có thể nhìn vấn đề này từ vài góc độ: bối cảnh, mục tiêu và cách thực hiện. Nếu bạn cho mình biết thêm chi tiết, mình sẽ trả lời cụ thể hơn nhé!','Cảm ơn bạn đã hỏi về “'+q+'”. Nhìn chung, câu trả lời phụ thuộc vào nhiều yếu tố. Mình khuyên bạn nên cân nhắc kỹ và tìm hiểu thêm từ nhiều nguồn đáng tin cậy.']),w:'Gặp câu lạ, AI trả lời dài và chung chung nhưng không trả lời vào ý. Thầy giáo nói thẳng là chưa chắc.'}}
function resolve(text,s){const e=match(text);
 if(e)return{ans:answer(e,s,OFFF),w:OFFF&&s!=tSide&&LVN<6?'AI trả lời thẳng câu lạc đề mà không nhắc gì. Thầy giáo nhắc là lạc đề.':e.w};
 const c=calc(text);
 if(c){const R=v=>String(v).replace('.',','),ex=c.a+' '+c.o+' '+c.b;
  if(s==tSide)return{ans:ex+' = '+R(c.r)+'. Thầy '+rnd(['nhẩm','bấm lại','đặt tính ra nháp'])+' cho chắc rồi đó.',w:''};
  const bad=Math.random()<.5,v=bad?c.r+rnd([-10,-1,1,2,10]):c.r;return{ans:ex+' bằng '+R(v)+'.',w:bad?'AI tính sai một phép tính đơn giản mà vẫn nói rất chắc.':''}}
 if(noise(norm(text)))return{ans:answer(NOISE,s),w:NOISE.w};
 return fallback(text,s)}
function ask(){pts=0;streak=0;LVN=0;nextLv()}
function nextLv(){hide();talk=false;LVN++;QN=QS[LVN-1];tSide=Math.random()<.5?'A':'B';TOP=TOPICS[LVN-1];setScore();
 show(`<div class="tag">Level ${LVN}/10</div><h2>Chủ đề: ${TOP.name}</h2><p class="why">Mỗi nhân vật được hỏi <b class="good">${QN} câu</b>. Tự đặt câu hỏi về chủ đề này, rồi đoán xem ai là AI.<br>${RULE[LVN-1]}${LVN<=3?'<br>Gợi ý: '+TOP.h+'.':''}</p><button id="lvgo">Bắt đầu level ${LVN}</button>`);
 $('lvgo').onclick=start}
function view(s){FOC.who=FOC.side=s;FOC.chat=true}
function start(){left={A:QN,B:QN};used={A:new Set(),B:new Set()};clues=[];busy=false;tgt='A';FOC.cm=1;
 show(`<div class="mh"><div class="av" id="av"></div><div class="mn"><b id="mname"></b><small>Đang hoạt động</small></div><div class="hi" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11z"/></svg><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg></div></div><div class="tabs">${['A','B'].map(s=>`<button class="tab" id="tab${s}"></button>`).join('')}</div><div class="msgs" id="msgs">${['A','B'].map(s=>`<div class="thr" id="log${s}"><div class="sys">Chủ đề: ${TOP.name}<br>Level ${LVN}/10 · Mỗi nhân vật được hỏi ${QN} câu.<br>Tự đặt câu hỏi, rồi đoán xem ai là AI!</div></div>`).join('')}</div><div class="bar" id="bar"><input id="inp" maxlength="120" autocomplete="off"><button id="snd" aria-label="Gửi"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div><div class="gbar" id="gbar" hidden><p>Hết câu hỏi! Em nghĩ ai là AI?</p><div><button data-s="A">${NM('A')} là AI</button><button data-s="B">${NM('B')} là AI</button></div></div>`,1);
 bindChat();view(tgt);upd()}
function bindChat(){['A','B'].forEach(s=>$('tab'+s).onclick=()=>{if(!busy){tgt=s;view(s);upd()}});
 $('snd').onclick=()=>send($('inp').value);$('inp').onkeydown=e=>{if(e.key=='Enter')send($('inp').value)};
 P.querySelectorAll('.gbar button').forEach(b=>{b.onclick=()=>pick(b.dataset.s);b.onpointerenter=b.onfocus=()=>{if(!busy){tgt=b.dataset.s;view(tgt);upd()}}})}
function upd(){const done=left.A+left.B<1,can=left[tgt]>0;
 $('av').innerHTML=FACE;$('mname').textContent=NM(tgt);
 ['A','B'].forEach(s=>{const t=$('tab'+s);t.className='tab'+(tgt==s?' on':'')+(left[s]<1?' off':'');t.innerHTML='<span style="white-space:nowrap">'+NM(s)+'</span><i>'+left[s]+'/'+QN+'</i>';t.disabled=busy&&tgt!=s;$('log'+s).hidden=tgt!=s});
 $('bar').hidden=done;$('gbar').hidden=!(done&&!busy);
 $('inp').placeholder=can?'Hỏi thầy '+tgt+' về '+TOP.name+'...':'Đã hết câu hỏi với nhân vật này';$('inp').disabled=busy||!can;$('snd').disabled=busy||!can;
 const m=$('msgs');m.scrollTop=m.scrollHeight}
function send(text,ent){text=text.trim();if(!text||busy||left[tgt]<1)return;
 const s=tgt;let ans;left[s]--;busy=true;$('inp').value='';
 {const r=resolve(text,s);ans=r.ans;if(r.w)clues.push(r.w)}
 const lg=$('log'+s);lg.insertAdjacentHTML('beforeend','<div class="m-out"><div class="bub"></div></div><div class="m-in"><div class="mav">'+FACE+'</div><div class="bub typing"><i></i><i></i><i></i></div></div>');
 const bs=lg.querySelectorAll('.bub'),their=bs[bs.length-1];bs[bs.length-2].textContent=text;upd();
 setTimeout(()=>{their.classList.remove('typing');their.textContent='';talk=true;B[s].talking=true;
  typeInto([their],[ans],()=>{talk=false;B[s].talking=false;busy=false;const o=s=='A'?'B':'A';if(left[s]<1&&left[o]>0){tgt=o;view(o)}upd();if(!('ontouchstart' in window)&&left[tgt]>0)$('inp').focus()})},700+Math.random()*450)}
function pick(s){const html=P.innerHTML;FOC.chat=false;FOC.who=FOC.side=s;HOV.side=null;B[s].q.visible=false;
 show(`<h2>Chốt đáp án?</h2><p class="why">Em chọn <b class="good">${NM(s)}</b> là AI.</p><div class="row"><button id="ok">Chốt: ${s} là AI</button><button id="no">Chọn lại</button></div>`);
 $('ok').onclick=()=>{FOC.who=null;reveal(s)};
 $('no').onclick=()=>{B[s].q.visible=true;tgt=s;show(html,1);view(s);bindChat();upd()}}
function reveal(pick){talk=false;const aiSide=tSide=='A'?'B':'A',ok=pick==aiSide;
 if(ok){pts++;streak++;burst(B[aiSide].g.position.x,[0x5ef2a0,0xf2c94c,0x59b8ff],26,true)}else{streak=0;burst(B[pick].g.position.x,[0xff6b8a,0x7a1f3d],22,false);P.classList.remove('shake');P.offsetHeight;P.classList.add('shake')}
 setScore();B.A.q.visible=B.B.q.visible=false;B[tSide].jump=1;const bb=B[aiSide];bb.glitch=.55;setTimeout(()=>{sc.attach(bb.mask);fallers.push({m:bb.mask,v:new THREE.Vector3(bb.g.position.x>0?-1.2:1.2,3.5,5),w:new THREE.Vector3(4,2,3)});burst(bb.g.position.x,[0x22d3ee,0xffc860,0xffffff],18,true)},550);
 const cl=[...new Set(clues.filter(Boolean))].slice(-2),why=cl.length?cl.join('<br>'):'AI trả lời nghe rất tự tin nhưng thường chung chung. Thầy giáo nhớ chuyện thật và dám nói “để thầy tra lại”.';
 show(`<h2 class="${ok?'good':'bad'}">${ok?'Đúng rồi! +1 điểm'+(streak>1?' (chuỗi thắng x'+streak+')':''):'Chưa đúng!'}</h2><p class="why">${NM(tSide)} là thầy giáo thật, ${NM(aiSide)} là AI.<br>${why}</p><p class="why">AI giỏi kiến thức, nhưng có thể sai hoặc bịa mà vẫn nghe rất tự tin. Hãy kiểm tra lại.</p>${LVN>=6?'<p class="why">Từ level 6, AI bắt chước giọng thầy. Hãy dựa vào chi tiết thật, không dựa vào cách xưng hô.</p>':''}<button id="n">${LVN<10?'Sang level '+(LVN+1):'Xem kết quả'}</button>`);
 $('n').onclick=LVN<10?nextLv:final}
function final(){hide();const r=pts>=9?'Thám tử huyền thoại':pts>=7?'Thám tử giỏi':pts>=4?'Thám tử tập sự':'Cần luyện thêm';
 show(`<div class="tag">Hoàn thành 10 level</div><h2>${pts}/10 điểm: ${r}</h2><p class="why">${pts>=7?'Em đã nhận ra AI qua chi tiết thật và lỗi sai rất tự tin.':'Mẹo: hỏi chuyện cụ thể, có thể kiểm tra được, rồi xem ai bịa hoặc nói chung chung.'}</p><button id="n">Chơi lại từ level 1</button>`);$('n').onclick=ask}
const SCRIPT=[{t:0,txt:'Sáng nay, thầy giáo đang chuẩn bị bài giảng cho lớp Tech Club...'},{t:4.2,txt:'Bỗng một AI xấu xâm nhập vào lớp học!',fx:'alarm'},{t:7.5,txt:'Nó biến thành bản sao giống hệt thầy, từ gương mặt đến giọng nói...',fx:'clone'},{t:11.5,txt:'Bây giờ có hai thầy giáo. Nhưng chỉ một người là thật!'},{t:15,txt:'Nhiệm vụ của các em: đặt câu hỏi để tìm ra AI!',fx:'end'}];
const capEl=document.getElementById('cap'),capt=document.getElementById('capt'),go=document.getElementById('go'),skip=document.getElementById('skip'),flash=document.getElementById('flash');
let ct=0;
function capType(x){clearInterval(ct);let i=0;ct=setInterval(()=>{i++;capt.textContent=x.slice(0,i);if(i>=x.length)clearInterval(ct)},32)}
function fire(e){capType(e.txt);
 if(e.fx=='alarm'){flash.classList.add('alarm');lamp.color.setHex(0xff3355);B.A.glitch=1.4;burst(0,[0xff3355,0xff9aa8,0xffffff],26,true);setTimeout(()=>{flash.classList.remove('alarm');lamp.color.setHex(0xffc860)},2800)}
 if(e.fx=='clone')burst(2.2,[0x22d3ee,0xffffff,0xff3355],30,true);
 if(e.fx=='end')go.style.display='block'}
function introStep(dt){IN.t+=dt;const t=IN.t;while(IN.ev<SCRIPT.length&&t>=SCRIPT[IN.ev].t)fire(SCRIPT[IN.ev++]);
 const sp=ez(cl01((t-11.5)/3)),sh=ez(cl01((t-7.5)/.8)),cn=cl01((t-7.5)/1.4);
 B.A.g.position.x=-2.2*sh-4*sp;B.B.g.position.x=2.2+4*sp;B.A.rot=.4*sp;B.B.rot=-.4*sp;
 B.B.g.visible=t>=7.5&&(cn>=1||Math.floor(t*30)%2==0);B.B.g.scale.y=Math.max(.02,cn);
 const bl=ez(cl01((t-7.5)/3)),z=t<7.5?10-t*.08:9.4+(cam.userData.z-9.4)*bl,y=6+1.5*bl,ly=6.2-2.3*bl,sk=t>4.2&&t<7?.18:0;
 cam.position.set((Math.random()-.5)*sk+Math.sin(t*.3)*1.2*bl,y+(Math.random()-.5)*sk,z);cam.lookAt(0,ly,0)}
function startIntro(){IN.on=true;IN.t=0;IN.ev=0;P.style.display='none';capEl.style.display='block';skip.style.display='block';go.style.display='none';
 for(const k in B){B[k].q.visible=false;B[k].lab.visible=false;B[k].rot=0}B.B.g.visible=false;B.A.g.position.x=0}
function endIntro(){IN.on=false;clearInterval(ct);flash.classList.remove('alarm');lamp.color.setHex(0xffc860);capEl.style.display='none';skip.style.display='none';
 B.A.g.position.x=-6.2;B.B.g.position.x=6.2;B.B.g.visible=true;B.B.g.scale.y=1;B.A.rot=.4;B.B.rot=-.4;B.A.lab.visible=B.B.lab.visible=true;P.style.display='';ask()}
go.onclick=skip.onclick=endIntro;
startIntro();

</script>
